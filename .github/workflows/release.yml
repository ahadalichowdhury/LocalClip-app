name: Release macOS DMG

# Push a version tag (e.g. `git tag v2.0.0 && git push origin v2.0.0`) to
# build a universal DMG (Apple Silicon + Intel) and publish it as a GitHub
# Release for that tag. "Run workflow" on the Actions tab builds the DMG as
# a downloadable artifact without publishing a release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      CI: true
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - name: Install Rust targets
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm ci

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$ ]]; then
            echo "::error::Tag $GITHUB_REF_NAME is not a version like v2.0.0"; exit 1
          fi
          jq --arg v "$VERSION" '.version = $v' src-tauri/tauri.conf.json > tauri.conf.tmp
          mv tauri.conf.tmp src-tauri/tauri.conf.json
          echo "Building LocalClip $VERSION"

      - name: Test
        run: |
          npx tsc --noEmit
          npx jest --ci
          cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build universal app, DMG and update bundle
        env:
          # Signs the auto-update bundle (key pair: tauri signer generate;
          # public key is in tauri.conf.json → plugins.updater.pubkey).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Optional: add these repository secrets to ship a signed and
          # notarized app. Without them the app is ad-hoc signed.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            unset APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY
          fi
          if [ -z "$APPLE_ID" ]; then
            unset APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID
          fi
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY secret is missing (needed for auto-update)"; exit 1
          fi
          npx tauri build --target universal-apple-darwin --bundles app,dmg \
            --config '{"bundle":{"createUpdaterArtifacts":true}}'

      - name: Collect release files
        id: files
        run: |
          BUNDLE=src-tauri/target/universal-apple-darwin/release/bundle
          VERSION=$(jq -r .version src-tauri/tauri.conf.json)
          DMG=$(ls "$BUNDLE"/dmg/*.dmg | head -1)
          TGZ="$BUNDLE/macos/LocalClip.app.tar.gz"
          test -f "$DMG" && test -f "$TGZ" && test -f "$TGZ.sig"

          mkdir -p dist-release
          cp "$DMG" dist-release/
          UPDATE_NAME="LocalClip_${VERSION}_universal.app.tar.gz"
          cp "$TGZ" "dist-release/$UPDATE_NAME"

          # Manifest the app's updater reads from releases/latest/download/latest.json
          URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/${UPDATE_NAME}"
          SIG=$(cat "$TGZ.sig")
          jq -n --arg v "$VERSION" --arg url "$URL" --arg sig "$SIG" \
                --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
                --arg notes "See https://github.com/${GITHUB_REPOSITORY}/releases/tag/v${VERSION}" \
            '{version: $v, notes: $notes, pub_date: $date,
              platforms: {"darwin-aarch64": {signature: $sig, url: $url},
                          "darwin-x86_64":  {signature: $sig, url: $url}}}' \
            > dist-release/latest.json
          cat dist-release/latest.json
          ls -lh dist-release
          echo "dmg_name=$(basename "$DMG")" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.files.outputs.dmg_name }}
          path: dist-release/
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'NOTES'
          ## Download

          **LocalClip_…_universal.dmg** below works on both Apple Silicon and Intel Macs (macOS 11 or later).

          1. Open the DMG and drag **LocalClip** to **Applications**.
          2. Open LocalClip. If macOS says it can't be checked for malicious software:
             open **System Settings → Privacy & Security** and click **Open Anyway**
             (or right-click the app → **Open**). This is needed once, because the app
             isn't notarized by Apple.
          3. Press **⌘⇧V** to open your clipboard history.
          4. For auto-paste, allow LocalClip in
             **System Settings → Privacy & Security → Accessibility**.

          Already have LocalClip 2.1 or later? It updates itself — look for
          "Restart to update" in the popup, or use **Check for Updates…** in the menu bar.
          NOTES
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist-release/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist-release/* \
              --title "LocalClip $GITHUB_REF_NAME" \
              --notes-file notes.md \
              --generate-notes
          fi
